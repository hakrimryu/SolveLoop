name: solveloop

services:
  backend:
    image: solveloop-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DBを.envに設定してください}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USERを.envに設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを.envに設定してください}
      AUTH_ALLOWED_ORIGINS: '${AUTH_ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000","http://127.0.0.1:5173","http://127.0.0.1:5174"]}'
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 3
      start_period: 10s
    labels:
      local.solveloop.description: "SolveLoop ローカル開発用 API"
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DBを.envに設定してください}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USERを.envに設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORDを.envに設定してください}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      local.solveloop.description: "SolveLoop ローカル開発用 PostgreSQL・pgvector"

volumes:
  postgres_data:
    labels:
      local.solveloop.description: "SolveLoop ローカルDBの永続データ"
