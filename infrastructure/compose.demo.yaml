name: solveloop-demo

services:
  demo-api:
    image: solveloop-demo:runtime
    build:
      context: ../backend
      target: runtime
    environment:
      DB_HOST: demo-db
      POSTGRES_DB: solveloop_demo
      POSTGRES_USER: solveloop_demo
      POSTGRES_PASSWORD: SolveLoop-Isolated-Demo-Only!
      SOLVELOOP_DEMO: "1"
      SOLVELOOP_DEMO_INSTANCE: ef53d43d-57f8-43b7-8230-31983ef3f020
      AUTH_ALLOWED_ORIGINS: '["http://127.0.0.1:8020","http://127.0.0.2:5180","http://127.0.0.1:8000"]'
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: qwen3:8b
      OLLAMA_EMBED_MODEL: embeddinggemma-2:270m-q8_0-text
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - ../demo:/demo:ro
    depends_on:
      demo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 3
    labels:
      local.solveloop.description: "架空企業の合成資料専用API・原本と分離"
  demo-db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: solveloop_demo
      POSTGRES_USER: solveloop_demo
      POSTGRES_PASSWORD: SolveLoop-Isolated-Demo-Only!
    volumes:
      - demo_data:/var/lib/postgresql/data
      - ./demo-init.sql:/docker-entrypoint-initdb.d/10-demo-identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U solveloop_demo -d solveloop_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      local.solveloop.description: "最終合成シード専用DB・原本volume接続禁止"

volumes:
  demo_data:
    labels:
      local.solveloop.description: "SolveLoop デモ専用合成資料・原本ではない"
