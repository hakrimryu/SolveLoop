[project]
name = "solveloop-backend"
version = "0.1.0"
description = "SolveLoop の API 実行基盤"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.0.55",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 専用の PostgreSQL 検証DBを使用"]
